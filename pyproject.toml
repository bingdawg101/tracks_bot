[project]
name = "careers-tracker"
version = "0.1.0"
description = "Accurate, fast alerts when trading firms open graduate / final-year internship roles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
tracker = "tracker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "F841", "RUF059"]
"tracker/__main__.py" = ["ARG001"]
