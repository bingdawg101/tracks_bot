# Careers Tracker configuration.
#
# Each firm entry:
#   slug:     stable id used in CLI + state filenames
#   name:     display name
#   adapter:  greenhouse | lever   (more adapters land in later phases)
#   source:   adapter connection settings, e.g. {token: janestreet}
#   enabled:  set false to pause a firm without deleting its config
#   filters:  per-firm overrides; lists are MERGED with `defaults` below
#
# Filter semantics (see tracker/filters.py):
#   - a posting is IGNORED if its title/department contains any `exclude` term
#   - `locations`: posting location (or body) must contain one of these; empty => any
#   - `eligibility_terms`: graduate / final-year / internship signal in title or body
#   - `include`: role keyword; match + eligibility + location => MATCH (alert)
#   - fits location + eligibility but not `include` => REVIEW (soft alert, dashboard)

defaults:
  include:
    - trader
    - trading
    - quant
    - quantitative
    - research
    - researcher
    - sales and trading
    - global markets
    - commodities
    - commodity
    - structuring
    - strats
    - execution
    - market maker
    - market making
  exclude:
    - senior
    - vice president
    - "vp,"
    - executive director
    - managing director
    - lead
    - head of
    - manager
    - "director,"
    - principal
    - staff
    - experienced hire
    - "10+ years"
    - devops
    - site reliability
    - recruiter
    - talent acquisition
  locations:
    - london
    - united kingdom
    - ", uk"
    - "(uk)"
    - "uk）"
    - england
    - britain
  location_excludes:            # kill "London, Ontario" / "Kyiv, Ukraine" etc.
    - ontario
    - canada
    - kentucky
    - ukraine
    - ", oh"
    - ", ky"
    - ", on"
    - arkansas
    - new london
  eligibility_terms:
    - graduate
    - grad
    - intern
    - internship
    - placement
    - "final year"
    - "final-year"
    - penultimate
    - summer analyst
    - "off-cycle"
    - "off cycle"
    - campus
    - apprentice
    - apprenticeship
    - trainee
    - "co-op"
    # German (Deutsche Bank et al.)
    - praktikum
    - praktikant
    - werkstudent
    - absolvent
    - traineeprogramm
    - berufseinstieg
    - duales studium
  # Authoritative when the source tags a structured employment type.
  eligible_employment_types:
    - intern
    - graduate
    - "new grad"
    - "co-op"
    - "co op"
    - placement
    - campus
    - student
    - apprentice
    - trainee
  excluded_employment_types:
    - experienced
    - permanent
    - "full-time: experienced"
    - "experienced hire"

failure_alert_threshold: 3
http_timeout_seconds: 20.0
http_retries: 2
max_concurrency: 8

